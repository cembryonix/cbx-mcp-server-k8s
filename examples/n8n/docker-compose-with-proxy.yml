# Docker Compose with MCP Server running as container
# Usage: docker-compose -f docker-compose-with-image.yml up -d
#
# This runs the full stack including the MCP server from Docker image.
# No need to start the MCP server separately.

services:
  n8n:
    image: n8nio/n8n:2.3.2
    environment:
      - N8N_COMMUNITY_PACKAGES_ALLOW_TOOL_USAGE=true
    ports:
      - "5678:5678"
    volumes:
      - ./n8n_data:/home/node/.n8n
      - ./workflows:/home/node/workflows:ro
    restart: unless-stopped
    networks:
      - n8n-network
    depends_on:
      - mcp-proxy

  mcp-proxy:
    build:
      context: .
      dockerfile: Dockerfile.mcp-proxy
    ports:
      - "9000:9000"
    environment:
      # Connect to mcp-server container (not host.docker.internal)
      - REAL_MCP_SERVER_URL=http://mcp-server:8080/mcp/
      - PROXY_PORT=9000
    restart: unless-stopped
    networks:
      - n8n-network
    depends_on:
      - mcp-server

  mcp-server:
    image: ghcr.io/cembryonix/cbx-mcp-server-k8s:0.3.1
    environment:
      - HOME=/home/appuser
      - CBX_MCP_SERVER_TRANSPORT_TYPE=http
    ports:
      - "8080:8080"
    volumes:
      # Mount kubeconfig (default: ~/.kube)
      - ${KUBECONFIG_DIR:-~/.kube}:/home/appuser/.kube:ro
      # Mount ArgoCD config (default: ~/.config/argocd)
      - ${ARGOCD_CONFIG_DIR:-~/.config/argocd}:/home/appuser/.config/argocd:ro
    restart: unless-stopped
    networks:
      - n8n-network

networks:
  n8n-network:
    driver: bridge