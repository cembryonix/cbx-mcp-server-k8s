# n8n + proxy + MCP server
# Usage: docker-compose up -d
#
# Reference example for MCP servers that can't handle n8n's extra attributes.
# CBX MCP K8s Server has built-in middleware, so this proxy is NOT needed for it.

volumes:
  n8n_data:

services:
  n8n:
    image: n8nio/n8n:2.4.8
    environment:
      - N8N_COMMUNITY_PACKAGES_ALLOW_TOOL_USAGE=true
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ../workflows:/home/node/workflows:ro
    restart: unless-stopped
    networks:
      - n8n-network
    depends_on:
      - mcp-proxy

  mcp-proxy:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "9000:9000"
    environment:
      - REAL_MCP_SERVER_URL=http://mcp-server:8080/mcp/
      - PROXY_PORT=9000
    restart: unless-stopped
    networks:
      - n8n-network
    depends_on:
      - mcp-server

  mcp-server:
    image: ghcr.io/cembryonix/cbx-mcp-server-k8s:0.3.1
    environment:
      - HOME=/home/appuser
      - CBX_MCP_SERVER_TRANSPORT_TYPE=http
    ports:
      - "8080:8080"
    volumes:
      - ${KUBECONFIG_DIR:-~/.kube}:/home/appuser/.kube:ro
      - ${ARGOCD_CONFIG_DIR:-~/.config/argocd}:/home/appuser/.config/argocd:ro
    restart: unless-stopped
    networks:
      - n8n-network

networks:
  n8n-network:
    driver: bridge